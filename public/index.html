<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<title>Battleship · SimplexityLab</title>

		<link rel="preconnect" href="https://fonts.googleapis.com">
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
		<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Albert+Sans:wght@400;600;700&family=Anton&family=Barlow:wght@400;500&family=Oswald:wght@200;300;400&display=swap">

		<script type="text/javascript" src="javascripts/ext/underscore.js"></script>
		<script type="text/javascript" src="javascripts/ext/jquery-1.7.1.js"></script>
		<script type="text/javascript" src="javascripts/ext/jshashtable-2.1.js"></script>
		<script type="text/javascript" src="javascripts/ext/jquery.numeric.js"></script>
		<script type="text/javascript" src="javascripts/ext/jquery.numberformatter.js"></script>
		<script type="text/javascript" src="javascripts/ext/backbone.js"></script>
		<script type="text/javascript" src="javascripts/ext/icanhaz.js"></script>

		<script type="text/javascript" src="javascripts/app/I18n.js"></script>
		<script type="text/javascript" src="javascripts/app/Boat.js"></script>
		<script type="text/javascript" src="javascripts/app/Cell.js"></script>
		<script type="text/javascript" src="javascripts/app/Board.js"></script>
		<script type="text/javascript" src="javascripts/app/Game.js"></script>
		<script type="text/javascript" src="javascripts/app/FundsChart.js"></script>

		<script type="text/javascript" src="javascripts/boot.js"></script>


		<link rel="stylesheet" href="stylesheets/main.css" type="text/css" media="screen" charset="utf-8">

		<script id="board" type="text/html">
			<td>{{ name }}</td>
		</script>
	</head>
	<body>
		<div class="page">
			<div class="lang-switch">
				<label for="langSelect" class="visually-hidden" data-i18n="language">Language</label>
				<select id="langSelect">
					<option value="en">English</option>
					<option value="es">Español</option>
					<option value="pt">Português</option>
				</select>
			</div>

			<header class="header">
				<img class="header__logo" src="images/simplexitylab-logo.png" alt="SimplexityLab" width="160" height="78">
				<p class="kicker" data-i18n="kicker">Agile Battleship</p>
				<h1 class="title" data-i18n="title">Battleship</h1>
				<div class="title-bar"></div>
			</header>

			<section class="card fleet">
				<p class="card__label" data-i18n="fleet">Fleet</p>
				<ul class="legend">
					<li><span class="swatch aircraft-carrier"></span><span data-i18n="aircraftCarrier">Aircraft carrier (5)</span></li>
					<li><span class="swatch battleship"></span><span data-i18n="battleship">Battleship (4)</span></li>
					<li><span class="swatch submarine"></span><span data-i18n="submarine">Submarine (3)</span></li>
					<li><span class="swatch cruiser"></span><span data-i18n="cruiser">Cruiser (3)</span></li>
					<li><span class="swatch destroyer"></span><span data-i18n="destroyer">Destroyer (2)</span></li>
				</ul>
			</section>

			<main class="game">
				<section class="card">
					<div class="controls">
						<div class="controls__field">
							<label for="shotsPerIteration" data-i18n="shotsPerIteration">Shots per iteration</label>
							<input id="shotsPerIteration" type="number" min="1" max="40" value="40"/>
						</div>
						<button id="newGame" data-i18n="newGame">New game</button>
					</div>

					<div id="container" data-i18n-attr="data-empty:emptyBoard" data-empty="Press “New game” to deploy the fleet"></div>
				</section>

				<aside class="sidebar">
					<section class="card">
						<p class="card__label" data-i18n="scoreboard">Scoreboard</p>
						<table id="info">
							<tr>
								<td data-i18n="totalShotsRemaining">Total shots remaining</td>
								<td id="totalShotsRemaining">&ndash;</td>
							</tr>
							<tr>
								<td data-i18n="shotsRemainingForIteration">Shots remaining for iteration</td>
								<td id="shotsRemainingForIteration">&ndash;</td>
							</tr>
							<tr>
								<td data-i18n="balance">Balance</td>
								<td id="funds">&ndash;</td>
							</tr>
							<tr>
								<td id="endGameResult" colspan="2"></td>
							</tr>
						</table>
					</section>

					<section class="card">
						<p class="card__label" data-i18n="chartTitle">Balance per shot</p>
						<div id="fundsChart" class="chart"></div>
					</section>
				</aside>
			</main>

			<footer class="footer">SimplexityLab</footer>
		</div>
	</body>

	<script type="text/javascript">

  		var _gaq = _gaq || [];
  		_gaq.push(['_setAccount', 'UA-38246571-1']);
  		_gaq.push(['_trackPageview']);

  		(function() {
    		var ga = document.createElement('script'); ga.type = 'text/javascript'; ga.async = true;
    		ga.src = ('https:' == document.location.protocol ? 'https://ssl' : 'http://www') + '.google-analytics.com/ga.js';
    		var s = document.getElementsByTagName('script')[0]; s.parentNode.insertBefore(ga, s);
  		})();
	</script>
</html>
